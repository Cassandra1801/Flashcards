<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanske udsagnsord — Flashcards</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html">📚 Flashcards</a>
</header>

<main class="app">
  <a class="back-link" href="../index.html">← Alle bunker</a>
  <h1>Spanske udsagnsord</h1>
  <p class="intro">Klik på et kort for at se svaret.</p>

  <div class="card-list">
    <details class="card">
      <summary>
        <span class="card-front">hablar</span>
        <span class="reveal-hint">Klik for at se svaret</span>
      </summary>
      <div class="card-back">at tale</div>
    </details>

    <details class="card">
      <summary>
        <span class="card-front">comer</span>
        <span class="reveal-hint">Klik for at se svaret</span>
      </summary>
      <div class="card-back">at spise</div>
    </details>

    <details class="card">
      <summary>
        <span class="card-front">vivir</span>
        <span class="reveal-hint">Klik for at se svaret</span>
      </summary>
      <div class="card-back">at bo / at leve</div>
    </details>
  </div>
</main>
