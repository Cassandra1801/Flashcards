<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <button id="homeBtn" class="brand" type="button">📚 Flashcards</button>
  <span id="dueBadge" class="due-badge hidden"></span>
</header>

<main id="app" class="app"></main>

<template id="tpl-deck-card">
  <div class="deck-card">
    <div class="deck-card-main">
      <h3 class="deck-name"></h3>
      <p class="deck-meta"></p>
    </div>
    <div class="deck-card-actions">
      <button class="btn btn-primary btn-study" type="button">Study</button>
      <button class="btn btn-secondary btn-manage" type="button">Manage</button>
      <button class="btn btn-danger btn-delete-deck" type="button">Delete</button>
    </div>
  </div>
</template>

<template id="tpl-card-row">
  <div class="card-row">
    <div class="card-row-text">
      <p class="card-front"></p>
      <p class="card-back"></p>
      <p class="card-srs-info"></p>
    </div>
    <div class="card-row-actions">
      <button class="btn btn-secondary btn-edit-card" type="button">Edit</button>
      <button class="btn btn-danger btn-delete-card" type="button">Delete</button>
    </div>
  </div>
</template>

<script src="js/storage.js"></script>
<script src="js/srs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
